name: Stage Branson 2027 attraction logos
on:
  push:
    branches: [stage-2027-branson-attractions]
    paths: ['.github/workflows/stage-branson-logos.yml']
permissions:
  contents: write
jobs:
  store-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the original transparent attraction logos
        run: |
          mkdir -p dist/assets
          curl --fail --location --silent --show-error --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JGM3uCMSVvgtZgN7GNXTSyPmo7/5b2033fa-6f74-445e-8315-d7f3e213e513.png' --output dist/assets/carnival-of-chaos.png
          curl --fail --location --silent --show-error --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JGM3uCMSVvgtZgN7GNXTSyPmo7/0b4f07ca-16de-4f72-afab-3b68d3fffcb8.png' --output dist/assets/ninth-inning-nightmare.png
          file dist/assets/carnival-of-chaos.png dist/assets/ninth-inning-nightmare.png
          test "$(stat -c%s dist/assets/carnival-of-chaos.png)" -gt 100000
          test "$(stat -c%s dist/assets/ninth-inning-nightmare.png)" -gt 100000
      - name: Commit the logo files to the staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/carnival-of-chaos.png dist/assets/ninth-inning-nightmare.png
          if ! git diff --cached --quiet; then
            git commit -m "Store original 2027 attraction logo artwork"
            git push
          fi
