<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Field of Screams Branson | 2027 Season Coming Soon</title>
  <meta name="description" content="Field of Screams Branson haunted attractions. The 2027 season is coming soon.">
  <link rel="canonical" href="https://fieldofscreamsbranson.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Field of Screams Branson | 2027 Season Coming Soon">
  <meta property="og:description" content="Haunted attractions in Branson, Missouri. The 2027 season is coming soon.">
  <meta property="og:url" content="https://fieldofscreamsbranson.com/">
  <meta property="og:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <meta property="og:image:alt" content="Field of Screams Branson Haunted Attractions">
  <meta property="og:image:width" content="1598">
  <meta property="og:image:height" content="608">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/cinzel.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("assets/cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-display: swap;
    }
    :root {
      --green-hi: #c9ff9e;
      --green: #45e83a;
      --green-deep: #138a1c;
      --rule: #2fbf2a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #000;
      color: #eee;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
    }
    /* The cover's spiderweb texture, stretched behind the whole page */
    .backdrop {
      position: fixed;
      inset: 0;
      /* zoom into the web-only left edge of the cover so no logo text ghosts through */
      background: url("assets/fos-cover.jpg") 0 50% / auto 340% repeat-x;
      opacity: 0.22;
      filter: blur(1px) grayscale(1);
      z-index: 0;
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .cover {
      display: block;
      width: 100%;
      height: auto;
      -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent);
              mask-image: linear-gradient(to bottom, #000 82%, transparent);
    }
    .announce {
      position: relative;
      padding: clamp(8px, 2vw, 20px) 16px clamp(48px, 8vw, 96px);
      width: 100%;
    }
    .announce::before {
      content: "";
      position: absolute;
      left: 50%; top: 40%;
      width: min(900px, 100%); height: 70%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(69, 232, 58, 0.16), transparent 70%);
      pointer-events: none;
    }
    .ruled {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 18px);
      margin: 0 auto;
      max-width: 760px;
      color: var(--green);
      font-weight: 700;
      font-size: clamp(0.8rem, 2.2vw, 1.35rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(69, 232, 58, 0.5);
      padding-left: 0.32em; /* balance trailing letter-spacing */
    }
    .ruled::before, .ruled::after {
      content: "";
      flex: 1;
      height: 2px;
      min-width: 24px;
      background: linear-gradient(90deg, transparent, var(--rule));
      box-shadow: 0 0 8px rgba(69, 232, 58, 0.6);
    }
    .ruled::after { background: linear-gradient(90deg, var(--rule), transparent); }
    h1 {
      margin: clamp(10px, 2vw, 18px) 0 clamp(8px, 1.5vw, 14px);
      font-weight: 700;
      font-size: clamp(2.6rem, 9.5vw, 7.5rem);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--green-hi) 0%, var(--green) 45%, var(--green-deep) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 22px rgba(69, 232, 58, 0.35));
    }
    .place {
      margin: 0;
      color: #f4f4f4;
      font-weight: 600;
      font-size: clamp(0.85rem, 2.4vw, 1.5rem);
      letter-spacing: 0.4em;
      padding-left: 0.4em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main>
    <img class="cover" src="assets/fos-cover.jpg" width="1598" height="608" alt="Field of Screams Branson — Haunted Attractions">
    <section class="announce">
      <div class="ruled">The 2027 Season</div>
      <h1>Coming Soon</h1>
      <p class="place">Branson, Missouri</p>
    </section>
  </main>
</body>
</html>
