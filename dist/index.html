<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Field of Screams Branson | 2027 Season Coming Soon</title>
  <meta name="description" content="Field of Screams Branson returns in 2027 with Carnival of Chaos, an all-new haunted attraction, and 9th Inning Nightmare.">
  <link rel="canonical" href="https://fieldofscreamsbranson.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Field of Screams Branson | 2027 Season Coming Soon">
  <meta property="og:description" content="Carnival of Chaos is all new for 2027, joining 9th Inning Nightmare at Field of Screams Branson.">
  <meta property="og:url" content="https://fieldofscreamsbranson.com/">
  <meta property="og:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <meta property="og:image:alt" content="Field of Screams Branson Haunted Attractions">
  <meta property="og:image:width" content="1598">
  <meta property="og:image:height" content="608">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/cinzel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fos-bg.jpg" as="image">
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("assets/cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-display: swap;
    }
    :root {
      --green: #08ed06;
      --green-glow: rgba(8, 237, 6, 0.45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000 url("assets/fos-bg.jpg") right center / cover no-repeat fixed;
      color: #fff;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0) 65%);
      pointer-events: none;
    }
    main {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .stack {
      width: min(820px, 100%);
      text-align: center;
      container-type: inline-size;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: center center;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(8,237,6,0.16));
      animation: logo-heartbeat 4.8s ease-in-out infinite;
    }
    .season {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.4cqw, 20px);
      margin-top: clamp(22px, 4cqw, 36px);
      color: #f5fff3;
      font-size: clamp(12px, 2.8cqw, 19px);
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1.5;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
    }
    .season span {
      padding-left: 0.18em;
      white-space: nowrap;
    }
    .season::before, .season::after {
      content: "";
      flex: 0 1 110px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green));
      box-shadow: 0 0 8px rgba(8,237,6,0.32);
    }
    .season::after { transform: rotate(180deg); }
    h1 {
      margin: clamp(8px, 1.5cqw, 16px) 0 0;
      color: #f5fff4;
      font-size: clamp(32px, 7cqw, 64px);
      font-weight: 700;
      letter-spacing: 0.09em;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow:
        0 2px 5px #000,
        0 0 8px rgba(8,237,6,0.68),
        0 0 24px rgba(8,237,6,0.42);
      animation: coming-soon-glow 3.6s ease-in-out infinite alternate;
    }
    /* A restrained double heartbeat: two small beats, then a calm pause. */
    @keyframes logo-heartbeat {
      0%, 16%, 36%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(8,237,6,0.16));
      }
      8% {
        transform: scale(1.008);
        filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 14px rgba(8,237,6,0.22));
      }
      24% {
        transform: scale(1.012);
        filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 18px rgba(8,237,6,0.30));
      }
    }
    @keyframes coming-soon-glow {
      from { text-shadow: 0 2px 5px #000, 0 0 6px rgba(8,237,6,0.40), 0 0 18px rgba(8,237,6,0.24); }
      to   { text-shadow: 0 2px 5px #000, 0 0 12px rgba(8,237,6,0.82), 0 0 32px rgba(8,237,6,0.55); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, h1 { animation: none; }
    }
    /* Phones and tablets: center the whole layout */
    @media (max-width: 900px) {
      body { background-position: 72% center; background-attachment: scroll; }
      body::before {
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.3) 100%);
      }
      main { padding: 40px 16px; }
      .stack { width: min(600px, 100%); }
      .season { font-size: clamp(11px, 2.9cqw, 17px); }
      h1 { font-size: clamp(30px, 8cqw, 50px); }
    }

    /* Preview of the two confirmed haunted attractions for the 2027 season. */
    .attractions {
      margin-top: clamp(32px, 5cqw, 48px);
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,.16);
    }
    .attractions-heading {
      margin: 0 0 22px;
      color: #e4dedb;
      font-family: "Cinzel", Georgia, serif;
      font-size: clamp(11px, 2cqw, 14px);
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
    }
    .attractions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .attraction {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 215px;
      padding: 34px 14px 22px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      background: linear-gradient(155deg, rgba(24,24,24,.86), rgba(3,3,3,.76));
      box-shadow: 0 12px 35px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.05);
    }
    .attraction--carnival {
      border-color: rgba(236,55,55,.38);
      box-shadow: 0 12px 35px rgba(0,0,0,.5), 0 0 26px rgba(220,18,18,.10);
    }
    .attraction--nightmare {
      border-color: rgba(47,112,238,.30);
      box-shadow: 0 12px 35px rgba(0,0,0,.5), 0 0 26px rgba(18,81,220,.09);
    }
    .attraction img {
      display: block;
      max-width: 100%;
      width: 100%;
      height: 157px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.75));
    }
    .attraction--nightmare img { height: 148px; }
    .attraction-new {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 15px;
      border: 1px solid #e34747;
      border-radius: 3px;
      background: linear-gradient(110deg, #9f0707, #e22525 48%, #970707);
      color: #fff;
      font: 800 11px/1 "Cinzel", Georgia, serif;
      letter-spacing: .13em;
      white-space: nowrap;
      text-shadow: 0 1px 2px #4c0000;
      box-shadow: 0 0 17px rgba(220,23,23,.4);
    }
    @media (max-width: 620px) {
      .attractions { margin-top: 33px; padding-top: 20px; }
      .attractions-heading { margin-bottom: 23px; letter-spacing: .11em; }
      .attractions-grid { grid-template-columns: 1fr; gap: 25px; }
      .attraction { min-height: 190px; padding: 29px 15px 14px; }
      .attraction img, .attraction--nightmare img { height: 153px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <img class="logo" src="assets/fos-logo.png" width="1925" height="535" alt="Field of Screams Branson — Haunted Attractions">
      <div class="season"><span>The 2027 Season</span></div>
      <h1>Coming Soon</h1>
      <section class="attractions" aria-label="2027 Haunted Attractions">
        <h2 class="attractions-heading">Two Terrifying Attractions Await</h2>
        <div class="attractions-grid">
          <article class="attraction attraction--carnival" aria-label="Carnival of Chaos, all new for 2027">
            <span class="attraction-new">ALL NEW FOR 2027</span>
            <img src="assets/carnival-of-chaos.png" width="1688" height="932" alt="Carnival of Chaos" loading="eager" decoding="async">
          </article>
          <article class="attraction attraction--nightmare" aria-label="9th Inning Nightmare">
            <img src="assets/ninth-inning-nightmare.png" width="2048" height="682" alt="9th Inning Nightmare" loading="eager" decoding="async">
          </article>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
