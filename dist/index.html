<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Field of Screams Branson | 2027 Season Coming Soon</title>
  <meta name="description" content="Field of Screams Branson haunted attractions. The 2027 season is coming soon.">
  <link rel="canonical" href="https://fieldofscreamsbranson.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Field of Screams Branson | 2027 Season Coming Soon">
  <meta property="og:description" content="Haunted attractions in Branson, Missouri. The 2027 season is coming soon.">
  <meta property="og:url" content="https://fieldofscreamsbranson.com/">
  <meta property="og:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <meta property="og:image:alt" content="Field of Screams Branson Haunted Attractions">
  <meta property="og:image:width" content="1598">
  <meta property="og:image:height" content="608">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/cinzel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fos-bg.jpg" as="image">
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("assets/cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-display: swap;
    }
    :root {
      --green: #08ed06;
      --green-glow: rgba(8, 237, 6, 0.45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000 url("assets/fos-bg.jpg") right center / cover no-repeat fixed;
      color: #fff;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0) 65%);
      pointer-events: none;
    }
    main {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .stack {
      width: min(820px, 100%);
      text-align: center;
      container-type: inline-size;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 12px rgba(8,237,6,0.2));
      animation: logo-glow 4s ease-in-out infinite alternate;
    }
    .season {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.4cqw, 20px);
      margin-top: clamp(22px, 4cqw, 36px);
      color: #f5fff3;
      font-size: clamp(12px, 2.8cqw, 19px);
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1.5;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
    }
    .season span {
      padding-left: 0.18em;
      white-space: nowrap;
    }
    .season::before, .season::after {
      content: "";
      flex: 0 1 110px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green));
      box-shadow: 0 0 8px rgba(8,237,6,0.32);
    }
    .season::after { transform: rotate(180deg); }
    h1 {
      margin: clamp(8px, 1.5cqw, 16px) 0 0;
      color: #f5fff4;
      font-size: clamp(32px, 7cqw, 64px);
      font-weight: 700;
      letter-spacing: 0.09em;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow:
        0 2px 5px #000,
        0 0 8px rgba(8,237,6,0.68),
        0 0 24px rgba(8,237,6,0.42);
      animation: coming-soon-glow 3.6s ease-in-out infinite alternate;
    }
    @keyframes logo-glow {
      from { filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(8,237,6,0.14)); }
      to   { filter: drop-shadow(0 3px 8px rgba(0,0,0,0.9)) drop-shadow(0 0 20px rgba(8,237,6,0.38)); }
    }
    @keyframes coming-soon-glow {
      from { text-shadow: 0 2px 5px #000, 0 0 6px rgba(8,237,6,0.40), 0 0 18px rgba(8,237,6,0.24); }
      to   { text-shadow: 0 2px 5px #000, 0 0 12px rgba(8,237,6,0.82), 0 0 32px rgba(8,237,6,0.55); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, h1 { animation: none; }
    }
    /* Phones and tablets: center the whole layout */
    @media (max-width: 900px) {
      body { background-position: 72% center; background-attachment: scroll; }
      body::before {
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.3) 100%);
      }
      main { padding: 40px 16px; }
      .stack { width: min(600px, 100%); }
      .season { font-size: clamp(11px, 2.9cqw, 17px); }
      h1 { font-size: clamp(30px, 8cqw, 50px); }
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <img class="logo" src="assets/fos-logo.png" width="1925" height="535" alt="Field of Screams Branson — Haunted Attractions">
      <div class="season"><span>The 2027 Season</span></div>
      <h1>Coming Soon</h1>
    </div>
  </main>
</body>
</html>
