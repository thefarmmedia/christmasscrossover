<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Field of Screams Branson | 2027 Season Coming Soon</title>
  <meta name="description" content="Field of Screams Branson haunted attractions. The 2027 season is coming soon.">
  <link rel="canonical" href="https://fieldofscreamsbranson.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Field of Screams Branson | 2027 Season Coming Soon">
  <meta property="og:description" content="Haunted attractions in Branson, Missouri. The 2027 season is coming soon.">
  <meta property="og:url" content="https://fieldofscreamsbranson.com/">
  <meta property="og:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <meta property="og:image:alt" content="Field of Screams Branson Haunted Attractions">
  <meta property="og:image:width" content="1598">
  <meta property="og:image:height" content="608">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/cinzel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fos-bg.jpg" as="image">
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("assets/cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-display: swap;
    }
    :root {
      --green-hi: #d6ffaa;
      --green: #50f03c;
      --green-deep: #128c1e;
      --rule: #2fbf2a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000 url("assets/fos-bg.jpg") right center / cover no-repeat fixed;
      color: #eee;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0) 65%);
      pointer-events: none;
    }
    main {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 48px 16px 48px clamp(16px, 5vw, 120px);
    }
    .stack {
      width: min(640px, 40vw);
      text-align: center;
      container-type: inline-size;
    }
    .title {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 16px rgba(80, 240, 60, 0.3));
    }
    .branson, .fos {
      color: #f6f6f6;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .branson {
      margin-top: 1.2cqw;
      font-size: 4cqw;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      line-height: 1;
    }
    .ruled {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.4cqw;
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(80, 240, 60, 0.45);
      line-height: 1;
    }
    .ruled span { padding-left: 0.32em; }
    .ruled::before, .ruled::after {
      content: "";
      flex: 1;
      height: 2px;
      min-width: 24px;
      background: linear-gradient(90deg, transparent, var(--rule));
      box-shadow: 0 0 8px rgba(80, 240, 60, 0.6);
    }
    .ruled::after { background: linear-gradient(90deg, var(--rule), transparent); }
    .haunted { margin-top: 4.5cqw; font-size: 2.9cqw; }
    .fos {
      margin-top: 7cqw;
      font-size: 8.5cqw;
      line-height: 1;
      font-weight: 600;
    }
    .url {
      margin-top: 1.8cqw;
      font-size: 2.3cqw;
      font-weight: 700;
      letter-spacing: 0.34em;
      padding-left: 0.34em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: 0 0 8px rgba(80, 240, 60, 0.4);
    }
    .season { margin-top: 9cqw; font-size: 3cqw; }
    h1 {
      margin: 2.4cqw 0 0;
      font-weight: 700;
      font-size: 11.2cqw;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      background: linear-gradient(180deg, var(--green-hi) 0%, var(--green) 45%, var(--green-deep) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 16px rgba(80, 240, 60, 0.3));
    }
    /* Phones and tablets: center everything, keep the skull in view behind */
    @media (max-width: 900px) {
      body { background-position: 72% center; background-attachment: scroll; }
      body::before {
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.3) 100%);
      }
      main { justify-content: center; padding: 40px 16px; }
      .stack { width: min(560px, 100%); }
      .haunted { font-size: 3.2cqw; }
      .url { font-size: 2.8cqw; }
      .season { font-size: 3.8cqw; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <img class="title" src="assets/fos-title.png" width="2836" height="523" alt="Field of Screams">
      <div class="branson">BRANSON</div>
      <div class="ruled haunted"><span>Haunted Attractions</span></div>
      <div class="fos">FoS</div>
      <div class="url">fieldofscreamsbranson.com</div>
      <div class="ruled season"><span>The 2027 Season</span></div>
      <h1>Coming Soon</h1>
    </div>
  </main>
</body>
</html>
