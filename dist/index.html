<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Field of Screams Branson | 2027 Season Coming Soon</title>
  <meta name="description" content="Field of Screams Branson haunted attractions. The 2027 season is coming soon.">
  <link rel="canonical" href="https://fieldofscreamsbranson.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Field of Screams Branson | 2027 Season Coming Soon">
  <meta property="og:description" content="Haunted attractions in Branson, Missouri. The 2027 season is coming soon.">
  <meta property="og:url" content="https://fieldofscreamsbranson.com/">
  <meta property="og:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <meta property="og:image:alt" content="Field of Screams Branson Haunted Attractions">
  <meta property="og:image:width" content="1598">
  <meta property="og:image:height" content="608">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fieldofscreamsbranson.com/assets/fos-cover.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/cinzel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fos-bg.jpg" as="image">
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("assets/cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-display: swap;
    }
    :root {
      --green: #08ed06;
      --green-glow: rgba(8, 237, 6, 0.45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000 url("assets/fos-bg.jpg") right center / cover no-repeat fixed;
      color: #fff;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0) 65%);
      pointer-events: none;
    }
    main {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 48px 16px 48px clamp(16px, 4vw, 100px);
    }
    .stack {
      width: min(720px, 46vw);
      text-align: center;
      container-type: inline-size;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.85));
    }
    .season {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.4cqw;
      margin-top: 9cqw;
      font-size: 3.6cqw;
      font-weight: 900;
      letter-spacing: 0.34em;
      line-height: 1;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 0 #000, 0 0 8px rgba(0,0,0,0.9);
    }
    .season span { padding-left: 0.34em; }
    .season::before, .season::after {
      content: "";
      flex: 1;
      height: 0.9cqw;
      min-height: 3px;
      background: var(--green);
      border: 1px solid #000;
      box-shadow: 0 0 10px var(--green-glow);
    }
    h1 {
      margin: 2.6cqw 0 0;
      font-weight: 900;
      font-size: 10cqw;
      line-height: 1.05;
      letter-spacing: 0.04em;
      padding-left: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      background: linear-gradient(180deg, #ffffff 0%, #ffffff 30%, #08ed06 78%, #08ed06 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      -webkit-text-stroke: 0.35cqw #000;
      paint-order: stroke fill;
      filter: drop-shadow(0 0 14px var(--green-glow)) drop-shadow(0 3px 4px rgba(0,0,0,0.9));
    }
    /* Phones and tablets: center everything, keep the skull in view behind */
    @media (max-width: 900px) {
      body { background-position: 72% center; background-attachment: scroll; }
      body::before {
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.3) 100%);
      }
      main { justify-content: center; padding: 40px 16px; }
      .stack { width: min(600px, 100%); }
      .season { font-size: 4.2cqw; }
      h1 { font-size: 10.8cqw; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <img class="logo" src="assets/fos-logo.png" width="1925" height="535" alt="Field of Screams Branson — Haunted Attractions">
      <div class="season"><span>The 2027 Season</span></div>
      <h1>Coming Soon</h1>
    </div>
  </main>
</body>
</html>
